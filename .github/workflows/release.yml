name: Release

# Manual-only build. Builds the Windows .exe for a given tag and attaches it
# to that tag's GitHub Release — creates the release if one doesn't exist,
# otherwise uploads the asset without touching the body.
#
# Invoked via the `/release` slash command (which orchestrates the whole
# version-bump → commit → tag → push → release flow and dispatches this
# workflow as its final step), or directly with `gh workflow run release.yml
# -f tag=vX.Y.Z`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach .exe to (must already exist on the remote)'
        required: true
        type: string

permissions:
  contents: write  # required to upload assets / create releases

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend with build extras
        run: pip install -e "backend[build]"

      - name: Build frontend + .exe
        run: python build.py

      - name: Verify .exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/chess-review.exe)) {
            Write-Error "dist/chess-review.exe not produced"
            exit 1
          }
          Get-Item dist/chess-review.exe | Select-Object Name, Length

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist/chess-review.exe
          fail_on_unmatched_files: true
          # Don't generate notes — preserves whatever the /release command
          # (or you) wrote into the release body.
          generate_release_notes: false
