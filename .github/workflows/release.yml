name: Release

# Fires on a version tag push (v1.1.3, etc.). Builds the Windows .exe and
# attaches it to the GitHub Release that matches the tag — creates the
# release if one doesn't exist yet, otherwise just uploads the asset
# without touching the body, so any manually-written release notes survive.
#
# workflow_dispatch lets you re-run the build against an arbitrary tag/branch
# (useful for re-attaching the binary to an already-published release like
# v1.1.2 where this workflow didn't exist at publish time).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and attach .exe to'
        required: true
        type: string

permissions:
  contents: write  # required to upload assets / create releases

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # When dispatched manually, check out the supplied tag; on tag push
          # the default ref (the tag itself) is correct.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend with build extras
        run: pip install -e "backend[build]"

      - name: Build frontend + .exe
        run: python build.py

      - name: Verify .exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/chess-review.exe)) {
            Write-Error "dist/chess-review.exe not produced"
            exit 1
          }
          Get-Item dist/chess-review.exe | Select-Object Name, Length

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Honour the manually-supplied tag when dispatched; otherwise the
          # action picks up the pushed tag from the event.
          tag_name: ${{ github.event.inputs.tag || '' }}
          files: dist/chess-review.exe
          fail_on_unmatched_files: true
          # Don't generate notes — preserves whatever you (or the prior
          # release-creation step) wrote into the release body.
          generate_release_notes: false
